name: Auto Deploy to Shared Hosting

on:
  push:
    branches:
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Hosting via SSH
        run: |
          mkdir -p ~/.ssh
          
          # Tulis encrypted/raw key
          cat << 'EOF' > ~/.ssh/raw_key.pem
          ${{ secrets.SSH_KEY }}
          EOF
          chmod 600 ~/.ssh/raw_key.pem

          # Buka enkripsi passphrase jika ada (atau simpan langsung)
          if [ -n "${{ secrets.SSH_PASSPHRASE }}" ]; then
            echo "${{ secrets.SSH_PASSPHRASE }}" | openssl rsa -in ~/.ssh/raw_key.pem -passin stdin -out ~/.ssh/deploy_key 2>/dev/null || cp ~/.ssh/raw_key.pem ~/.ssh/deploy_key
          else
            cp ~/.ssh/raw_key.pem ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key

          echo "🚀 Menghubungkan ke Server Hosting..."
          ssh -T -i ~/.ssh/deploy_key \
              -p ${{ secrets.SSH_PORT }} \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=30 \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "cd ~/bossing-seal-online && git checkout production 2>/dev/null || true && git pull origin production && php artisan optimize:clear && php artisan optimize"

          echo "🎉 Deployment Selesai dan Berhasil!"
