name: Auto Deploy to Shared Hosting

on:
  push:
    branches:
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Hosting via SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key \
              -p ${{ secrets.SSH_PORT }} \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o LogLevel=ERROR \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            cd ~/bossing-seal-online || exit 0
            git checkout production 2>/dev/null || true
            git pull origin production || true
            
            # Sync public assets if needed
            if [ -d ~/public_html/seal.adybudi.my.id ]; then
              cp -r ~/bossing-seal-online/public/css ~/bossing-seal-online/public/js ~/bossing-seal-online/public/sounds ~/public_html/seal.adybudi.my.id/ 2>/dev/null || true
            fi

            # Refresh cache Laravel
            php artisan optimize:clear 2>/dev/null || true
            php artisan optimize 2>/dev/null || true

            # Restart PM2
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            pm2 restart seal-daemon 2>/dev/null || true

            echo "🚀 Deployment Selesai dan Berhasil!"
          EOF
