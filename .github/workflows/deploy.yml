name: Auto Deploy to Shared Hosting

on:
  push:
    branches:
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Hosting via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ~/bossing-seal-online
            
            # 1. Pull perubahan terbaru dari branch production
            git checkout production
            git pull origin production

            # 2. Pastikan permission folder tepat (agar LiteSpeed Web Server bisa membaca)
            chmod 755 ~/bossing-seal-online
            chmod 755 ~/bossing-seal-online/public
            chmod -R 775 ~/bossing-seal-online/storage ~/bossing-seal-online/bootstrap/cache

            # 3. Hubungkan Subdomain ke folder public Laravel jika belum terhubung
            rm -rf ~/public_html/seal.adybudi.my.id
            ln -s ~/bossing-seal-online/public ~/public_html/seal.adybudi.my.id

            # 4. Update dependency Laravel & Database
            php ~/composer.phar install --no-dev --optimize-autoloader --no-scripts || composer install --no-dev --optimize-autoloader --no-scripts
            php artisan migrate --force
            php artisan db:seed --force
            php artisan optimize:clear
            php artisan optimize

            # 4. Load Node.js & Update daemon Node.js & Restart PM2
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            cd daemon
            npm install --production
            pm2 restart seal-daemon || pm2 start bot-daemon.js --name "seal-daemon" || npx pm2 start bot-daemon.js --name "seal-daemon"
            pm2 save

            echo "🚀 Deployment Selesai dan Berhasil!"
