name: Auto Deploy to Shared Hosting

on:
  push:
    branches:
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Hosting via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: false
          script: |
            cd ~/bossing-seal-online || exit 1
            
            # 1. Pull branch production
            git checkout production || true
            git pull origin production || true

            # 2. Permissions untuk LiteSpeed Web Server
            chmod 755 ~ ~/public_html ~/bossing-seal-online ~/bossing-seal-online/public 2>/dev/null || true
            chmod 644 ~/bossing-seal-online/public/index.php ~/bossing-seal-online/public/.htaccess 2>/dev/null || true
            chmod -R 775 ~/bossing-seal-online/storage ~/bossing-seal-online/bootstrap/cache 2>/dev/null || true

            # 3. Hubungkan Subdomain ke folder public
            if [ -d ~/public_html ]; then
              ln -sfn ~/bossing-seal-online/public ~/public_html/seal.adybudi.my.id
            fi

            # 4. Refresh Cache Laravel
            php artisan optimize:clear 2>/dev/null || true
            php artisan optimize 2>/dev/null || true

            # 5. Restart PM2 Daemon
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            pm2 restart seal-daemon 2>/dev/null || true

            echo "🚀 Deployment Selesai dan Berhasil!"
